spring.application.name=APIGateway

server.port=8080

# NOTE: the Eureka client property is "serviceUrl.defaultZone" (camelCase).
# It is bound into a Map<String,String>, and Map keys are NOT relaxed the
# way regular bean properties are - "service-url.default-zone" is silently
# ignored, the client never finds the registry, and lb:// routes fail.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
